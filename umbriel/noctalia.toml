[colors]
background = "#12150bFF"
text_primary = "#e3e4d3FF"
text_muted = "#c5c9b0FF"
accent_primary = "#d4f855FF"
accent_secondary = "#bdce84FF"
warning = "#9fffa6FF"
error = "#ffb4abFF"
insert_hint = "#9fffa680"
backdrop = "#383c29FF"

[colors.border]
focused = "#d4f855FF"
unfocused = "#383c29FF"
