# Window Rules
#unfocused_opacity 1.0
window_rule=is_overlay:1,app_id:waybar
#windowrule=is_overlay:1,app_id:^dms
#windowrule=is_overlay:1,title:^dms
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk

window_rule=is_floating:1,app_id:blueman-manager
window_rule=width:1500,height:900,app_id:blueman-manager
window_rule=is_floating:1,unfocused_opacity:1,is_global:1,title:Picture-in-Picture
window_rule=is_floating:1,unfocused_opacity:1,is_global:1,app_id:^mpv$

window_rule=is_floating:1,app_id:zoom,title:annotate_toolbar

# GNOME apps
window_rule=no_border:1,app_id:^org\.gnome\.

# Terminal apps - no borders
window_rule=no_border:1,app_id:^org\.wezfurlong\.wezterm$
window_rule=no_border:1,app_id:^Alacritty$
window_rule=no_border:1,app_id:^com\.mitchellh\.ghostty$
window_rule=no_border:1,app_id:^kitty$

# Float DMS windows
window_rule=is_floating:1,app_id:^org\.quickshell$

layer_rule=no_animation:1,layer_name:^dms
