# ==========================================
# Video Output & Hardware Acceleration
# ==========================================
vo=gpu-next
hwdec=auto-safe

# High efficiency scaling for Intel iGPU
scale=spline36
cscale=spline36
dscale=mitchell

# ==========================================
# Window & Interface
# ==========================================
border=no
autofit-larger=85%x85%
cursor-autohide=1000
keep-open=yes
term-osd-bar
osd-font-size=28

# ==========================================
# Resume Playback
# ==========================================
save-position-on-quit=yes
watch-later-options=start,sid,aid,volume

# ==========================================
# Cache & Memory Management
# ==========================================
demuxer-max-bytes=150M
demuxer-max-back-bytes=50M
demuxer-readahead-secs=20

# ==========================================
# Audio & Subtitles
# ==========================================
audio-file-auto=fuzzy
sub-auto=fuzzy
slang=en,eng
alang=en,eng,ja,jpn
